<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<title>Itinerary</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>

<main id="lock" class="gate" hidden>
  <form class="gatecard" id="lock-form">
    <h1>Itinerary</h1>
    <p class="muted">Enter your passphrase. You only need it once on each device.</p>
    <input type="password" name="pass" aria-label="Passphrase" autocomplete="current-password"
           autocapitalize="off" spellcheck="false" required>
    <button class="btn primary" type="submit">Unlock</button>
    <p class="err" role="alert"></p>
  </form>
</main>

<main id="import" class="gate" hidden>
  <div class="gatecard">
    <h1>Import itinerary</h1>
    <p class="muted">The server is empty. Choose <code>seed/itinerary.json</code>.
      It's encrypted on this device before upload.</p>
    <input type="file" id="import-file" accept="application/json,.json">
    <ul class="err" id="import-errors"></ul>
  </div>
</main>

<div id="app" hidden>
  <div id="banner" class="banner" hidden>Offline. Viewing saved copy. Notes still save.</div>
  <div class="layout">
    <aside class="side">
      <div class="sidehd"><h1 id="side-title"></h1><div class="sync" id="side-sync"></div></div>
      <nav id="daylist" aria-label="Days"></nav>
    </aside>
    <div class="main">
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-tab="trip" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Trip</button>
        <button type="button" data-tab="notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>Notes</button>
        <button type="button" data-tab="codes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v8a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2z"/><path d="M9 6v12" stroke-dasharray="2 2"/></svg>Codes</button>
        <button type="button" data-tab="more">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More</button>
      </nav>
      <section id="view-trip"><div id="day"></div></section>
      <section id="view-notes" hidden></section>
      <section id="view-codes" hidden></section>
      <section id="view-more" hidden></section>
      <div class="fabs" id="fabs">
        <button type="button" id="fab-import" class="fab n">⇪ Import</button>
        <button type="button" id="fab-note" class="fab n">✎ Note</button>
        <button type="button" id="fab-add" class="fab" aria-label="Add event">+</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<dialog id="sheet" class="sheet"></dialog>
<dialog id="confirm" class="sheet"></dialog>
<div id="print-root"></div>
</body>
</html>
